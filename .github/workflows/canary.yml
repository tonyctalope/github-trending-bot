name: Scraper canary

# github.com/trending has no API: the bot parses HTML. This job scrapes the real
# page every day so a markup change surfaces here instead of as silently empty
# Discord digests. It is deliberately kept out of the PR pipeline, which must
# stay deterministic and offline.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  canary:
    name: Scrape github.com/trending
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Scrape the three periods and a language filter
        run: npm run canary
