version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patches:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Must track the Node major actually used at runtime (node:24-alpine).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint still declares `typescript <6.1.0`; moving to 7.x would
      # silently drop type-aware linting. Bump both together, deliberately.
      - dependency-name: 'typescript'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # A Node major jump also means bumping @types/node and engines: do it by hand.
      - dependency-name: 'node'
        update-types: [version-update:semver-major]
