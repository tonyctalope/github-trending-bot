services:
  github-trending-bot:
    image: ghcr.io/tonyctalope/github-trending-bot:latest
    container_name: github-trending-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Paris
      LOG_LEVEL: info
    volumes:
      # subscriptions created with /trending subscribe
      - ./data:/data
      # optional declarative config: put config.yaml in ./config
      - ./config:/config:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
