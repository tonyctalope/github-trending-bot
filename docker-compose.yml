services:
  github-trending-bot:
    image: ghcr.io/tonyctalope/github-trending-bot:latest
    container_name: github-trending-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Paris
      LOG_LEVEL: info
    # The image runs as uid 1000 (`node`). Bind mounts keep the host ownership,
    # so if your host user is not 1000 either chown the directories to 1000:1000
    # or run the container as yourself by uncommenting the line below.
    #user: '1001:1001'
    volumes:
      # subscriptions created with /trending subscribe + frozen period captures
      - ./data:/data
      # optional declarative config: put config.yaml in ./config
      - ./config:/config:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
